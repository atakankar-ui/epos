# Builds the Windows installer (Till-Setup-x.y.z.exe) on a real Windows machine.
#
# It runs when a version tag such as v0.8.0 is pushed, or by hand from the Actions tab.
# For a tag, the installer is attached to a GitHub Release with that name, ready to download.
name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Till-Setup
          path: dist/Till-Setup-*.exe
          if-no-files-found: error
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Till $TAG" --notes "Windows installer for the till. Download the Till-Setup file below and run it on the till PC."
          gh release upload "$TAG" dist/Till-Setup-*.exe --clobber
